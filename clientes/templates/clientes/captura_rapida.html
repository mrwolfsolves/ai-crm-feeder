<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Captura Rápida con IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Captura Rápida (pega el texto del cliente)</h1>
        <form method="POST">
            {% csrf_token %}
            <textarea class="form-control mb-3" name="texto_crudo" rows="8" placeholder="Pega aquí el correo, mensaje o notas del cliente..." required></textarea>
            <button type="submit" class="btn btn-primary">Extraer datos con IA</button>
        </form>
    </div>
</body>
</html>
