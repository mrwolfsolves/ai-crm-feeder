{% extends "clientes/base.html" %}
{% block title %}Captura Rápida — CRM Feeder{% endblock %}
{% block content %}
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-3"><i class="bi bi-magic text-primary"></i> Captura rápida con IA</h1>
            <p class="text-muted">Pega el correo, mensaje o notas del cliente y la IA extraerá los datos automáticamente.</p>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <textarea class="form-control mb-3" name="texto_crudo" rows="8" placeholder="Pega aquí el correo, mensaje o notas del cliente..." required></textarea>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-stars"></i> Extraer datos con IA
                </button>
            </form>
        </div>
    </div>
{% endblock %}
