<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM Feeder{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .navbar-brand {
            font-weight: 600;
        }
        .card {
            border: none;
            border-radius: 0.75rem;
        }
        .btn-primary {
            background-color: #2f5fa3;
            border-color: #2f5fa3;
        }
        .btn-primary:hover {
            background-color: #24497f;
            border-color: #24497f;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1f3a5f;">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_clientes' %}">
                <i class="bi bi-cpu"></i> CRM Feeder
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'listar_clientes' %}"><i class="bi bi-people"></i> Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'capturar_cliente' %}"><i class="bi bi-person-plus"></i> Nuevo cliente</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'captura_rapida' %}"><i class="bi bi-magic"></i> Captura rápida</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/api/docs/" target="_blank"><i class="bi bi-code-slash"></i> API Docs</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('form').forEach(function (form) {
            form.addEventListener('submit', function () {
                var boton = form.querySelector('button[type="submit"]');
                if (boton) {
                    boton.disabled = true;
                    boton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Procesando...';
                }
            });
        });
    });
    </script>
</body>
</html>
