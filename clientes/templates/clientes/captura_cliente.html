<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Captura de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Captura de Cliente</h1>

        {% if exito %}
            <div class="alert alert-success">Cliente capturado y enviado a EspoCRM correctamente.</div>
        {% endif %}
        {% if error %}
            <div class="alert alert-danger">Error: {{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" name="first_name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-control" name="last_name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input type="text" class="form-control" name="phone_number" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Calle</label>
                    <input type="text" class="form-control" name="street" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Ciudad</label>
                    <input type="text" class="form-control" name="city" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <input type="text" class="form-control" name="state" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Código Postal</label>
                    <input type="text" class="form-control" name="postal_code" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">País</label>
                    <input type="text" class="form-control" name="country" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Capturar Cliente</button>
        </form>
    </div>
</body>
</html>
